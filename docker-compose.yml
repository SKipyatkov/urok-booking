services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: urok
      POSTGRES_PASSWORD: urok
      POSTGRES_DB: urok_booking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urok -d urok_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://urok:urok@db:5432/urok_booking
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./scripts/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    command: ["sh", "/docker-entrypoint.sh"]

volumes:
  postgres_data:
