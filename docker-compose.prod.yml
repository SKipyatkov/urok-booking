# Production overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    volumes:
      - ./scripts/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    command: ["sh", "/docker-entrypoint.sh", "prod"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
